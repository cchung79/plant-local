<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 집 식물</title>
<meta name="theme-color" content="#1b2a20">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리 집 식물">
<style>
:root {
  --bg: #f4f6f2; --card: #ffffff; --ink: #1d2620; --sub: #66716a; --line: #dfe5dd;
  --green: #2f7d4f; --green-soft: #e3f1e7; --blue: #2b6cb0; --blue-soft: #e3eefa;
  --brown: #8a5a17; --brown-soft: #f6ecdc; --red: #c0392b; --red-soft: #fbe6e3;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111713; --card: #1b221d; --ink: #e8eee9; --sub: #9aa59d; --line: #2c362f;
    --green: #6fcf97; --green-soft: #1f3527; --blue: #7fb3f0; --blue-soft: #1c2a3b;
    --brown: #e0b06a; --brown-soft: #3a2d1a; --red: #ff8a7a; --red-soft: #3d201c;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
       font-variant-numeric: tabular-nums; padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: calc(10px + env(safe-area-inset-top)) 16px 8px; border-bottom: 1px solid var(--line); }
header h1 { margin: 0; font-size: 20px; }
header .sub { color: var(--sub); font-size: 13px; }
main { padding: 12px 16px; max-width: 640px; margin: 0 auto; }
nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
nav button { flex: 1; border: 0; background: none; color: var(--sub); font: inherit; font-size: 14px; padding: 12px 0; white-space: nowrap; }
nav button.on { color: var(--green); font-weight: 700; }
h2 { font-size: 15px; color: var(--sub); margin: 18px 0 8px; font-weight: 600; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
/* every card the same shape: name and place on the left (a long name wraps, never cut), schedule badges stacked on the right */
.plant { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.plant .main { flex: 1; min-width: 0; }
.plant .name { font-weight: 700; overflow-wrap: anywhere; }
.plant .loc { color: var(--sub); font-size: 13px; }
/* the soil state belongs to the plant, not the schedule — it sits after the place */
.plant .loc .badge { display: inline-block; margin-left: 6px; font-size: 12px; padding: 1px 7px; }
.badges { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex: none; }
.badge { font-size: 13px; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.amts { display: flex; gap: 14px; margin-bottom: 8px; font-size: 15px; color: var(--sub); flex-wrap: wrap; }
.amts label { display: flex; align-items: center; gap: 6px; } .amts input { width: 70px; font-size: 16px; padding: 7px 8px; } .amts #famt { width: 96px; }
button.badge.amt { border: 0; font: inherit; font-size: 14px; padding: 5px 10px; cursor: pointer; }
.todayamt { flex: none; display: flex; align-items: center; gap: 4px; font-size: 15px; color: var(--sub); flex-wrap: wrap; justify-content: flex-end; max-width: 52%; }
.card.done { flex-wrap: wrap; }
.todayamt:has(.amtbox) { flex-basis: 100%; max-width: 100%; order: 3; margin-top: 8px; justify-content: flex-end; }
.amtbox.quick { white-space: nowrap; display: flex; align-items: center; justify-content: flex-end; gap: 8px; font-size: 15px; }
.amtbox.quick .btn { padding: 9px 14px; font-size: 16px; white-space: nowrap; }
.amtbox [data-q] { background: var(--blue); color: #fff; }
.btn.ghost { background: var(--bg); color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
.wparts span { white-space: nowrap; margin-right: 8px; }
.wparts .badge { font-size: 13px; padding: 1px 6px; }
.todayamt input { width: 62px; font-size: 17px; padding: 6px 6px; text-align: right; -moz-appearance: textfield; }
.todayamt input::-webkit-inner-spin-button, .todayamt input::-webkit-outer-spin-button, .amts input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.amtbox { display: flex; align-items: center; gap: 6px; font-size: 15px; } .amtbox input { width: 72px; font-size: 16px; padding: 6px 8px; }
.b-water { background: var(--blue-soft); color: var(--blue); }
.b-fert { background: var(--brown-soft); color: var(--brown); }
.b-late { background: var(--red-soft); color: var(--red); font-weight: 700; }
.b-moist { background: var(--green-soft); color: var(--green); }
.empty { color: var(--sub); text-align: center; padding: 24px 0; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; width: 100%; }
input[type=number] { text-align: right; }
select { -webkit-appearance: none; appearance: none; background-color: var(--bg); color: var(--ink); padding-right: 32px;
         background-image: linear-gradient(45deg, transparent 50%, var(--sub) 50%), linear-gradient(135deg, var(--sub) 50%, transparent 50%);
         background-position: calc(100% - 18px) 50%, calc(100% - 12px) 50%; background-size: 6px 6px; background-repeat: no-repeat; }
.btn { border: 0; border-radius: 12px; padding: 12px 14px; font: inherit; font-weight: 700; cursor: pointer; }
.btn-water { background: var(--blue); color: #fff; }
.btn-fert { background: var(--brown); color: #fff; }
.btn-moist { background: var(--green); color: #fff; }
.btn-ghost { background: var(--bg); color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
.row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.field { display: grid; grid-template-columns: 1fr 110px; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.field:last-child { border-bottom: 0; }
.field.wide { grid-template-columns: 52px 1fr; }
.hsens { position: absolute; right: 16px; top: calc(env(safe-area-inset-top) + 14px); border: 1px solid var(--line); background: none; color: var(--sub); border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 13px; }
h1 .ver { font-size: 13px; font-weight: 400; color: var(--sub); vertical-align: 3px; }
.field label { font-size: 15px; }
.field .hint { color: var(--sub); font-size: 12px; display: block; }
.unit { display: flex; align-items: center; gap: 6px; }
.unit span { color: var(--sub); font-size: 14px; white-space: nowrap; }
body.locked { overflow: hidden; }
.sheet { position: fixed; inset: 0; background: var(--bg); z-index: 10; overflow-y: auto; padding-bottom: 40px; }
.sheet header { display: flex; align-items: center; gap: 10px; }
.sheet header button { border: 0; background: none; color: var(--green); font: inherit; font-size: 17px; padding: 4px 0; }
.suggest { border-left: 4px solid var(--green); }
.suggest p { margin: 0 0 10px; }
.log { font-size: 14px; display: grid; grid-template-columns: 88px 1fr auto auto; gap: 4px 6px; align-items: center; }
.log button.del { color: var(--red); }
.log button.del.sure { background: var(--red); color: #fff; border-radius: 8px; padding: 4px 8px; }
.log .d { color: var(--sub); }
.log button { border: 0; background: none; color: var(--sub); font-size: 13px; }
.toggle { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; }
.toastbtn { margin-left: 10px; border: 0; border-radius: 999px; padding: 4px 10px; font: inherit; font-weight: 700; background: var(--green); color: #fff; }
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg);
         padding: 10px 16px; border-radius: 999px; font-size: 14px; z-index: 20; display: none; }
.small { color: var(--sub); font-size: 13px; }
a { color: var(--green); }
</style>
</head>
<body>
<header><h1 id="title">우리 집 식물 <span class="ver">v39</span></h1><div class="sub" id="today"></div><button id="ssync" class="hsens" hidden></button></header>
<main id="view"></main>
<nav>
  <button data-tab="todo" class="on">할 일</button>
  <button data-tab="plants">식물</button>
  <button data-tab="ask">Claude에게 묻기</button>
  <button data-tab="settings">설정</button>
</nav>
<div class="toast" id="toast"></div>

<script src="online.js?v=39"></script>
<script src="sensor.js?v=39"></script>
<script src="sync.js?v=39"></script>
<script id="seed" type="application/json">{"version": 1, "source": "", "seasons": {"warm": [3, 10], "cold": [11, 2]}, "plants": []}</script>
<script>
"use strict";
// ---- 진단: an error anywhere shows as a red bar (screenshot it) and goes to the server log when connected ----
const DIAG = [];
function reportError(msg, where) {
  const text = `${new Date().toTimeString().slice(0, 8)} ${where || ""} ${msg}`.trim();
  DIAG.push(text); if (DIAG.length > 20) DIAG.shift();
  let bar = document.getElementById("diag");
  if (!bar) { bar = document.createElement("div"); bar.id = "diag"; bar.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:99;background:#c0392b;color:#fff;font:12px/1.4 monospace;padding:6px 8px;max-height:40vh;overflow:auto;white-space:pre-wrap"; bar.onclick = () => bar.remove(); document.body.appendChild(bar); }
  bar.textContent = "오류 (이 화면을 찍어 보내 주세요, 누르면 닫힘)\n" + DIAG.slice(-5).join("\n");
  try { if (typeof serverOn === "function" && serverOn()) serverCall("/api/clientlog", { msg: text, ua: navigator.userAgent, v: typeof APP_VERSION !== "undefined" ? APP_VERSION : "?" }).catch(() => {}); } catch (e) {}
}
window.addEventListener("error", e => reportError(`${e.message} @${(e.filename || "").split("/").pop()}:${e.lineno}:${e.colno}`, "error"));
window.addEventListener("unhandledrejection", e => reportError(String(e.reason && (e.reason.stack || e.reason.message) || e.reason).slice(0, 300), "promise"));
// ---- storage: everything stays on this phone (localStorage); backup = export/import a JSON file ----
const KEY = "plantlocal.v1";
let db;
function load() {
  try { const s = localStorage.getItem(KEY); if (s) return JSON.parse(s); } catch (e) {}
  return null;
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { toast("저장 실패: 저장 공간을 확인하세요"); }
  if (typeof scheduleSync === "function") scheduleSync();
}
function fromSeed() {
  const seed = JSON.parse(document.getElementById("seed").textContent);
  const log = [];
  for (const p of seed.plants) {
    if (p.lastWater) log.push({ id: uid(), plant: p.id, type: "water", date: p.lastWater, note: "PLANTA 기록" });
    if (p.lastFert) log.push({ id: uid(), plant: p.id, type: "fert", date: p.lastFert, note: "PLANTA 기록" });
    delete p.lastWater; delete p.lastFert;
  }
  return { version: 1, seasons: seed.seasons, plants: seed.plants, log, source: seed.source };
}

// ---- dates (local calendar days, as YYYY-MM-DD) ----
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => iso(new Date());
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const diff = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);   // days from a to b
const md = s => { const d = parse(s); return `${d.getMonth() + 1}/${d.getDate()}`; };
function uid() { return Math.random().toString(36).slice(2, 10); }

function season(dateStr) {
  const m = parse(dateStr).getMonth() + 1, [a, b] = db.seasons.warm;
  return (a <= b ? (m >= a && m <= b) : (m >= a || m <= b)) ? "warm" : "cold";
}
const SEASON_KO = { warm: "따뜻한 계절", cold: "추운 계절" };
function monthsText(k) { const [a, b] = db.seasons[k]; return `${a}~${b}월`; }

// ---- schedule ----
const logsOf = (pid, type) => db.log.map((l, i) => [l, i]).filter(([l]) => l.plant === pid && (!type || l.type === type))
  .sort(([a, i], [b, j]) => a.date < b.date ? 1 : a.date > b.date ? -1 : (b.sensorT || 0) - (a.sensorT || 0) || j - i).map(([l]) => l);
const last = (pid, type) => logsOf(pid, type).find(l => !l.extra) || null;     // 추가 관수 does not move the next date
function interval(p, kind) {
  const s = season(today());
  if (kind === "fert" && !p.fert.on) return null;
  return p[kind][s] || null;
}
function due(p, kind) {               // {date, days} or {none:true} / {unknown:true}
  const iv = interval(p, kind);
  if (!iv) return { none: true };
  const l = last(p.id, kind);
  if (!l) return { unknown: true };
  let date = addDays(l.date, iv);
  const sn = logsOf(p.id, "snooze").find(x => x.kind === kind && x.date >= l.date);
  if (sn && sn.until > date) date = sn.until;
  if (kind === "fert") {
    const w = due(p, "water");
    if (!w.none && !w.unknown && date < w.date) return { date: w.date, days: diff(today(), w.date), withWater: true };
  }
  return { date, days: diff(today(), date) };
}
function lastMoist(p) {
  const w = last(p.id, "water"), m = last(p.id, "moist");
  return m && (!w || m.date >= w.date) ? m : null;
}
function dueText(d) {
  if (d.none) return "";
  if (d.unknown) return "기록 없음";
  if (d.days < 0) return `${-d.days}일 지남`;
  if (d.days === 0) return "오늘";
  if (d.days === 1) return "내일";
  return `${d.days}일 뒤`;
}
function badge(p, kind) {
  const d = due(p, kind); if (d.none) return "";
  const late = d.unknown ? false : d.days <= 0;
  return `<span class="badge ${late ? "b-late" : kind === "water" ? "b-water" : "b-fert"}">${kind === "water" ? "물" : "비료"} ${d.withWater ? "물과 같이" : dueText(d)}</span>`;
}

// ---- views ----
let tab = "todo";
const view = document.getElementById("view");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function plantRow(p) {
  const m = lastMoist(p);
  return `<div class="card plant" data-open="${p.id}">
    ${p.photo ? `<img src="${p.photo}" alt="" style="width:44px;height:44px;object-fit:cover;border-radius:10px;flex:none">` : ""}
    <div class="main"><div class="name">${esc(p.name)}</div><div class="loc">${esc(p.location)}${p.waterL ? ` · 💧${p.waterL}L` : ""}${m ? (m.value <= p.moistureMin ? ` <span class="badge b-late">흙 마름 ${m.value}%</span>` : ` <span class="badge b-moist">수분 ${m.value}%</span>`) : ""}</div></div>
    <div class="badges">${badge(p, "water")}${badge(p, "fert")}</div></div>`;
}
function renderTodo() {
  if (!db.plants.length) {
    view.innerHTML = `<div class="card" style="margin-top:12px"><b>식물이 아직 없습니다</b><p class="small">처음 데이터 파일(식물_시작데이터_*.json)을 이 폰에 받은 뒤, <b>설정 → 가져오기</b>로 넣으세요. 식물을 하나씩 직접 추가해도 됩니다(식물 탭).</p></div>`;
    return;
  }
  // 오늘 할 일 = due today or overdue by 정철 님's own schedule (dry soil is shown as a badge, it does not move a plant here)
  // 오늘 한 일 = watered or fed today;  다음 일정 = from tomorrow on, one heading per day
  // a plant stays under the last day it was watered/fed (오늘·어제·그제), so a watering with 추가 관수 shows its total for 3 days
  const now = [], next = new Map(), unknown = [], doneBy = [[], [], []];
  for (const p of db.plants) {
    const ds = ["water", "fert"].map(k => due(p, k)).filter(d => !d.none);
    if (ds.some(d => d.unknown)) unknown.push(p);
    const lastDid = logsOf(p.id).find(l => (l.type === "water" || l.type === "fert") && l.date <= today());
    const ago = lastDid ? diff(lastDid.date, today()) : 9;
    if (ago >= 0 && ago <= 2) doneBy[ago].push([p, logsOf(p.id).filter(l => (l.type === "water" || l.type === "fert") && l.date === lastDid.date)]);
    const min = Math.min(...ds.filter(d => !d.unknown).map(d => d.days));
    if (min <= 0) now.push([min, p]);
    else if (isFinite(min)) { const day = addDays(today(), min); if (!next.has(day)) next.set(day, []); next.get(day).push(p); }
  }
  now.sort((a, b) => a[0] - b[0]);
  const done = doneBy[0];
  const WD = ["일", "월", "화", "수", "목", "금", "토"], wd = s => WD[parse(s).getDay()];
  const dayHead = d => { const n = diff(today(), d); return `${n === 1 ? "내일" : n + "일 뒤"} · ${md(d)} (${wd(d)})`; };
  view.innerHTML =
    sensorTopHtml() +
    `<h2 style="font-size:17px;color:var(--ink)">오늘 할 일 · ${md(today())} (${wd(today())})${now.length ? ` · ${now.length}그루` : ""}</h2>` +
    (now.length ? now.map(x => plantRow(x[1])).join("") : `<div class="empty">${done.length ? "오늘 할 일을 다 했습니다" : "오늘은 할 일이 없습니다"}</div>`) +
    (done.length ? `<h2 style="font-size:17px;color:var(--ink)">오늘 한 일 · ${done.length}그루</h2>` + done.map(([p, did]) => doneRow(p, did, 0)).join("") : "") +
    [1, 2].map(n => doneBy[n].length ? `<h2>${n === 1 ? "어제" : "그제"} 한 일 · ${md(addDays(today(), -n))}</h2>` + doneBy[n].map(([p, did]) => doneRow(p, did, n)).join("") : "").join("") +
    (unknown.length ? `<h2>마지막 기록이 없음 — 물 준 날을 넣어 주세요</h2>${unknown.map(plantRow).join("")}` : "") +
    `<h2 style="font-size:17px;color:var(--ink);margin-top:28px">다음 일정</h2>` +
    [...next.keys()].sort().map(d => `<h2>${dayHead(d)}</h2>${next.get(d).map(plantRow).join("")}`).join("");
  bindSensorTop();
}
function renderPlants() {
  const byLoc = {};
  for (const p of db.plants) (byLoc[p.location || "위치 없음"] ??= []).push(p);
  view.innerHTML = Object.keys(byLoc).sort().map(l => `<h2>${esc(l)} · ${byLoc[l].length}</h2>${byLoc[l].map(plantRow).join("")}`).join("") +
    `<button class="btn btn-ghost" style="width:100%;margin-top:8px" id="add">+ 식물 추가</button>`;
  document.getElementById("add").onclick = () => openAddPlant();
}
let settingsSub = null;          // null = the settings menu, "eco" = Ecowitt page, "online" = online keys page
function subPage(title, body) {
  view.innerHTML = `<button class="btn btn-ghost" id="sback" style="margin-top:12px">‹ 설정</button><h2 style="font-size:18px;color:var(--ink)">${title}</h2>${body}`;
  document.getElementById("sback").onclick = () => { settingsSub = null; renderSettings(); window.scrollTo(0, 0); };
  bindKeys(); window.scrollTo(0, 0);
}
function menuRow(id, title, sub) {
  return `<div class="card plant" id="${id}" role="button"><div class="main"><div class="name">${title}</div><div class="loc">${sub}</div></div><span class="small" style="font-size:20px">›</span></div>`;
}
function renderSettings() {
  if (settingsSub === "eco") return subPage("Ecowitt 센서", `<div class="card">${ecoSettingsHtml()}</div>`);
  if (settingsSub === "online") return subPage("온라인 기능", keysSettingsHtml());
  if (settingsSub === "trash") {
    const list = [...(db.trash || [])].sort((a, b) => b.at - a.at);
    const nameOf = id => db.plants.find(p => p.id === id)?.name || "(지운 식물)";
    subPage("최근 지운 기록", list.length ? `<div class="card log">${list.map(t => `<span class="d">${t.what === "plant" ? "식물" : esc(t.data.date)}</span><span>${t.what === "plant" ? `<b>${esc(t.data.name)}</b> 기록 ${(t.logs || []).length}건과 함께` : `${esc(nameOf(t.data.plant))} · ${TYPE_KO[t.data.type] || ""}${t.data.value != null ? " " + t.data.value + "%" : ""}`} <span class="small">${agoText(Date.now() - t.at)} 지움</span></span><button data-rs="${t.id}">되살리기</button><span></span>`).join("")}</div>
      <p class="small">지운 지 ${TRASH_DAYS}일이 지나면 완전히 없어집니다.</p>` : `<div class="empty">최근 ${TRASH_DAYS}일 동안 지운 기록이 없습니다</div>`);
    for (const b of document.querySelectorAll("[data-rs]")) b.onclick = () => { restore(b.dataset.rs); settingsSub = "trash"; renderSettings(); };
    return;
  }

  document.getElementById("upd").onclick = forceUpdate;

    const a = +document.getElementById("ws").value, b = +document.getElementById("we").value;
    if (a >= 1 && a <= 12 && b >= 1 && b <= 12) {

// ---- plant sheet ----
let sheet = null;
function openPlant(id, isNew) {
  const p = db.plants.find(x => x.id === id); if (!p) return;
  sheet?.remove();
  sheet = document.createElement("div"); sheet.className = "sheet";
  document.body.appendChild(sheet); document.body.classList.add("locked");
  drawPlant(p, isNew);
}
function closeSheet() { sheet?.remove(); sheet = null; document.body.classList.remove("locked"); if (pendingReload) { location.reload(); return; } render(); }
function num(v) { const n = parseInt(v, 10); return Number.isFinite(n) && n > 0 ? n : null; }

function drawPlant(p, isNew) {
  header();

  sheet.innerHTML = `
  <header><button id="back">‹ 목록</button><h1 style="flex:1;font-size:18px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.name)}</h1></header>

    <div class="card" style="margin-top:10px">
      <div class="row2" style="margin-bottom:8px">
        <div><div class="small">물</div><b>${dueText(wd) || "—"}</b><div class="small">${lw ? `마지막 ${md(lw.date)} (${diff(lw.date, today())}일 전) · 아래 기록 기준` : "기록 없음"}</div></div>
        <div><div class="small">비료</div><b>${fd.none ? (p.fert.on ? "이번 계절 안 함" : "비료 일정 꺼짐") : dueText(fd)}</b>${fd.withWater ? `<div class="small">밀려서 다음 물 줄 때 같이</div>` : ""}<div class="small">${lf ? `마지막 ${md(lf.date)} (${diff(lf.date, today())}일 전)` : "기록 없음"}</div></div>
      </div>
      <div class="small">흙 수분: ${m ? `<b>${m.value}%</b> (${md(m.date)}) · 기준 ${p.moistureMin}% 이하면 물` : `아직 안 잼 · 기준 ${p.moistureMin}% 이하면 물`}</div>
    </div>

    <div class="card">
      <div class="unit" style="margin-bottom:8px"><span>기록할 날짜</span><input type="date" id="dt" value="${sheet.dataset.date || today()}" max="${today()}"><button class="btn btn-ghost" id="dtoday" style="padding:8px 10px;white-space:nowrap">오늘</button></div>
      <div class="row2" style="margin-bottom:8px"><input type="number" id="mv" inputmode="numeric" min="0" max="100" placeholder="수분계 %"><button class="btn btn-moist" id="mbtn">수분 기록</button></div>
      <div class="amts"><label>준 물 <input type="number" id="wamt" inputmode="decimal" step="0.1" min="0" value="${p.waterL ?? ""}" placeholder="—"> L</label><label>비료 <input type="text" id="famt" value="${esc(p.fertAmt ?? "")}" placeholder="예: 2mL"></label></div>
      <div class="row3"><button class="btn btn-water" id="wbtn">물 줌</button><button class="btn btn-fert" id="fbtn">비료 줌</button><button class="btn btn-ghost" id="bbtn">물+비료</button></div>
    </div>
    <div id="sg"></div>
    ${expertCardHtml(p)}
    ${diagCardHtml(p)}
    <button class="btn btn-ghost" id="toask" style="width:100%;margin-top:8px">이 식물에 대해 Claude와 대화하기 →</button>

    <h2>내 일정 (지금은 ${SEASON_KO[s]})</h2>
    <div class="card">
      <div class="field"><label>물 · 따뜻한 계절<span class="hint">${monthsText("warm")}</span></label><div class="unit"><input type="number" inputmode="numeric" data-k="water.warm" value="${p.water.warm ?? ""}"><span>일</span></div></div>
      <div class="field"><label>물 · 추운 계절<span class="hint">${monthsText("cold")}</span></label><div class="unit"><input type="number" inputmode="numeric" data-k="water.cold" value="${p.water.cold ?? ""}"><span>일</span></div></div>
      <div class="field"><label>1회 용수량</label><div class="unit"><input type="number" inputmode="decimal" step="0.05" min="0" data-k="waterL" value="${p.waterL ?? ""}"><span>L</span></div></div>
      <div class="field"><label>최대 관수 무게</label><div class="unit"><input type="number" inputmode="decimal" step="0.1" min="0" data-k="maxKg" value="${p.maxKg ?? ""}"><span>kg</span></div></div>
      <div class="toggle"><label for="fon">비료 일정 사용</label><input type="checkbox" id="fon" style="width:auto;transform:scale(1.4)" ${p.fert.on ? "checked" : ""}></div>
      <div class="field" ${p.fert.on ? "" : 'style="opacity:.4"'}><label>비료 · 따뜻한 계절<span class="hint">비우면 안 함</span></label><div class="unit"><input type="number" inputmode="numeric" data-k="fert.warm" value="${p.fert.warm ?? ""}" ${p.fert.on ? "" : "disabled"}><span>일</span></div></div>
      <div class="field" ${p.fert.on ? "" : 'style="opacity:.4"'}><label>비료 · 추운 계절<span class="hint">비우면 안 함</span></label><div class="unit"><input type="number" inputmode="numeric" data-k="fert.cold" value="${p.fert.cold ?? ""}" ${p.fert.on ? "" : "disabled"}><span>일</span></div></div>
      <div class="field"><label>물 줄 기준 수분<span class="hint">수분계가 이 값 이하면 물</span></label><div class="unit"><input type="number" inputmode="numeric" min="0" max="100" data-k="moistureMin" value="${p.moistureMin ?? ""}"><span>%</span></div></div>
      ${sensorFieldHtml(p)}
    </div>
    ${sensorGraphHtml(p)}

    <h2>식물 정보</h2>
    <div class="card">
      <div class="field wide"><label>이름</label><input data-t="name" value="${esc(p.name)}"></div>
      <div class="field wide"><label>위치</label><input data-t="location" value="${esc(p.location)}" list="locs"></div>
      <div class="field wide"><label>학명</label><input data-t="species" value="${esc(p.species)}"></div>
      <div style="padding-top:6px"><label class="small">메모</label><textarea data-t="note" rows="2">${esc(p.note)}</textarea></div>
      <datalist id="locs">${[...new Set(db.plants.map(x => x.location).filter(Boolean))].map(l => `<option value="${esc(l)}">`).join("")}</datalist>
      ${careRefText(p)}
    </div>

    <h2>기록</h2>
    <div class="card log">${logs.length ? logs.map(l => `<span class="d">${l.date}</span><span>${TYPE[l.type]}${l.extra ? " 추가" : ""}${(l.type === "water" || l.type === "fert") && amountText(l) ? ` ${esc(amountText(l))}` : ""}${l.type === "moist" ? ` ${l.value}%` : ""}${l.type === "snooze" ? ` (${l.kind === "water" ? "물" : "비료"} → ${md(l.until)})` : ""}${l.type === "edit" ? ` ${esc(l.note)}` : ""}${l.note && l.type !== "edit" ? ` <span class="small">${esc(l.note)}</span>` : ""}${l.id === baseW || l.id === baseF ? ` <b style="color:var(--green)">← 다음 날짜 기준</b>` : ""}</span><button data-edit="${l.id}">수정</button><button class="del" data-del="${l.id}">삭제</button>`).join("") : `<span class="small" style="grid-column:1/-1">기록이 없습니다</span>`}</div>
    <button class="btn btn-ghost" id="delp" style="width:100%;margin-top:16px;color:var(--red)">이 식물 지우기</button>
  </main>`;

  const $ = id => sheet.querySelector("#" + id);
  const d = () => { const v = $("dt").value || sheet.dataset.date || today(); return v > today() ? today() : v; };
  const showDay = () => {
    const v = d(), tag = v === today() ? "" : ` · ${md(v)}`;
    $("wbtn").textContent = "물 줌" + tag; $("fbtn").textContent = "비료 줌" + tag; $("bbtn").textContent = "물+비료" + tag; $("mbtn").textContent = "수분 기록" + tag;
  };
  const pick = () => { if ($("dt").value) sheet.dataset.date = $("dt").value; showDay(); };
  for (const ev of ["input", "change", "blur"]) $("dt").addEventListener(ev, pick);
  $("dtoday").onclick = () => { delete sheet.dataset.date; $("dt").value = today(); showDay(); };
  showDay();
  $("back").onclick = closeSheet;
  const add = (type, extra = {}) => {
    if (type === "water" && logsOf(p.id, "water").some(x => x.date === d())) {     // a second watering that day: ask first (a double tap must not count)
      const wa = parseFloat($("wamt")?.value), amt = wa > 0 ? Math.round(wa * 100) / 100 : null, day = d();
      setTimeout(() => showSuggest(p, { text: `${md(day)} 물 기록이 이미 있습니다. 더 준 것이면 <b>추가 관수${amt ? " " + amt + "L" : ""}</b>로 기록할까요? (다음 물 날짜는 처음 관수 기준 그대로)`,
        actions: [{ t: `추가 관수${amt ? " " + amt + "L" : ""}로 기록`, f: () => { db.log.push({ id: uid(), plant: p.id, type: "water", date: day, extra: true, ...(amt ? { amount: amt } : {}) }); save(); drawPlant(p); toast(`추가 관수${amt ? " " + amt + "L" : ""}를 기록했습니다`); } }] }), 0);
      return false;
    }
    if (type === "fert" && logsOf(p.id, "fert").some(x => x.date === d())) { toast(`${md(d())} 비료 기록은 이미 있습니다`); return; }
    const newer = (type === "water" || type === "fert") ? logsOf(p.id, type).find(x => x.date > d()) : null;
    const wa = parseFloat($("wamt")?.value), fa = ($("famt")?.value || "").trim();
    db.log.push({ id: uid(), plant: p.id, type, date: d(), ...(type === "water" && wa > 0 ? { amount: Math.round(wa * 100) / 100 } : {}), ...(type === "fert" && fa ? { amount: fa } : {}), ...extra }); save();
    if (newer) setTimeout(() => showSuggest(p, {
      text: `${md(d())} ${type === "water" ? "물" : "비료"} 기록을 넣었지만, 더 최근인 <b>${md(newer.date)}</b> 기록이 있어서 다음 날짜는 ${md(newer.date)} 기준으로 계산됩니다. ${md(newer.date)} 기록이 잘못 들어간 것이면 지우세요.`,
      actions: [{ t: `${md(newer.date)} 기록 지우기`, f: () => removeLog(newer, p) }],
    }), 0);
  };
  $("wbtn").onclick = () => { pick(); const sg = afterWater(p, d()); if (add("water") === false) return; drawPlant(p); toast(`${md(d())} 물 준 날을 기록했습니다`); if (sg) showSuggest(p, sg); };
  $("fbtn").onclick = () => { pick(); add("fert"); drawPlant(p); toast(`${md(d())} 비료 준 날을 기록했습니다`); };
  $("bbtn").onclick = () => { pick(); const sg = afterWater(p, d()); add("water"); add("fert"); drawPlant(p); toast(`${md(d())} 물과 비료를 기록했습니다`); if (sg) showSuggest(p, sg); };
  $("mbtn").onclick = () => {
    pick(); const v = parseInt($("mv").value, 10);
    if (!(v >= 0 && v <= 100)) { toast("0~100 사이 숫자를 넣어 주세요"); return; }

  };
  for (const inp of sheet.querySelectorAll("[data-k]")) inp.onchange = () => {
    const [a, b] = inp.dataset.k.split("."), old = b ? p[a][b] : p[a], v = num(inp.value);
    if (a === "moistureMin") p.moistureMin = Math.min(100, v ?? 0);
    else if (a === "waterL" || a === "maxKg") { const l = parseFloat(inp.value); if (l > 0) p[a] = Math.round(l * 100) / 100; else delete p[a]; }
    else p[a][b] = v;
    if (old !== (b ? p[a][b] : p[a])) db.log.push({ id: uid(), plant: p.id, type: "edit", date: today(), note: `${label(inp.dataset.k)} ${unitv(old, inp.dataset.k)} → ${unitv(b ? p[a][b] : p[a], inp.dataset.k)}` });
    save(); drawPlant(p); toast("바꿨습니다");
  };
  $("fon").onchange = e => { p.fert.on = e.target.checked; db.log.push({ id: uid(), plant: p.id, type: "edit", date: today(), note: `비료 일정 ${p.fert.on ? "켬" : "끔"}` }); save(); drawPlant(p); };
  for (const inp of sheet.querySelectorAll("[data-t]")) inp.onchange = () => { p[inp.dataset.t] = inp.value.trim(); save(); if (inp.dataset.t === "name") drawPlant(p); };
  for (const b of sheet.querySelectorAll("[data-del]")) b.onclick = () => {
    if (!b.classList.contains("sure")) {
      b.classList.add("sure"); b.textContent = "정말 삭제?";
      setTimeout(() => { if (b.isConnected) { b.classList.remove("sure"); b.textContent = "삭제"; } }, 4000);
      return;
    }
    const l = db.log.find(x => x.id === b.dataset.del); if (!l) return;
    removeLog(l, p);
  };
  for (const b of sheet.querySelectorAll("[data-edit]")) b.onclick = () => {

    box.innerHTML = `<div class="card" style="margin:4px 0;background:var(--bg)">
      <div class="unit"><span>날짜</span><input type="date" class="ed" value="${l.date}" max="${today()}">${l.type === "moist" ? `<input type="number" class="ev" inputmode="numeric" min="0" max="100" value="${l.value}" style="width:90px"><span>%</span>` : ""}</div>
      <div class="row3" style="margin-top:8px"><button class="btn btn-moist es">저장</button><button class="btn btn-ghost ex" style="color:var(--red)">지우기</button><button class="btn btn-ghost ec">취소</button></div></div>`;
    const dEl = b.previousElementSibling.previousElementSibling;   // the date cell of this row (date, text, 수정, 삭제)
    dEl.before(box);
    box.querySelector(".ec").onclick = () => box.remove();
    box.querySelector(".ex").onclick = () => { if (confirm(`${l.date} 기록을 지울까요?`)) removeLog(l, p); };
    box.querySelector(".es").onclick = () => {
      const nd = box.querySelector(".ed").value;
      if (!nd || nd > today()) { toast("날짜를 확인해 주세요"); return; }
      if (l.type === "moist") { const v = parseInt(box.querySelector(".ev").value, 10); if (!(v >= 0 && v <= 100)) { toast("0~100 사이 숫자"); return; } l.value = v; }
      l.date = nd; save(); drawPlant(p); toast(`${md(nd)}로 고쳤습니다`);
    };
  };
  $("delp").onclick = () => {
    if (confirm(`"${p.name}"을(를) 지울까요? 기록도 함께 지워지고, 30일 동안 설정 → 최근 지운 기록에서 되살릴 수 있습니다.`)) {
      trashIt("plant", p, { logs: db.log.filter(l => l.plant === p.id) });
      db.plants = db.plants.filter(x => x !== p); db.log = db.log.filter(l => l.plant !== p.id); save(); closeSheet();
    }
  };
  bindDiag(p); bindSensor(p); bindExpert(p);
  $("toask").onclick = () => { db.chatTarget = p.id; save(); tab = "ask"; sheet?.remove(); sheet = null; document.body.classList.remove("locked"); render(); window.scrollTo(0, 0); };
  if (isNew) sheet.querySelector('[data-t="name"]').focus();
}
function careRefText(p) {
  const c = p.careRef || {};
  const parts = [c.light, c.dry, c.mist && `분무 ${c.mist}`, c.repot && `분갈이 ${c.repot}`, c.toxic].filter(Boolean);
  return parts.length ? `<div class="small" style="margin-top:8px">${esc(c.src || "PLANTA")} 참고: ${parts.map(esc).join(" · ")}</div>` : "";
}
function unitv(v, k) { return v == null ? "없음" : v + (k === "moistureMin" ? "%" : k === "waterL" ? "L" : k === "maxKg" ? "kg" : "일"); }
function label(k) {
  return { "water.warm": "물(따뜻)", "water.cold": "물(추운)", "fert.warm": "비료(따뜻)", "fert.cold": "비료(추운)", moistureMin: "기준 수분", waterL: "1회 용수량", maxKg: "최대 관수 무게" }[k];
}

// ---- suggestions: the app only proposes; nothing changes until a button is pressed ----
function afterMoist(p, v, date) {
  const lw = last(p.id, "water"), s = season(date), iv = p.water[s];
  if (v <= p.moistureMin) {
    const since = lw ? diff(lw.date, date) : null;
    const out = { text: `수분 ${v}% — 기준 ${p.moistureMin}% 이하입니다. <b>물을 주세요.</b>`, actions: [{ t: "물 줌", f: () => sheet.querySelector("#wbtn").click() }] };
    if (since && iv && Math.abs(since - iv) >= Math.max(2, iv * 0.2))
      out.text += `<br>마지막 물 뒤 ${since}일 만에 말랐습니다. 지금 ${SEASON_KO[s]} 간격은 ${iv}일이에요.`,
      out.actions.push({ t: `간격 ${since}일로`, f: () => setInterval_(p, s, since) });
    return out;
  }
  // still moist: estimate when it reaches the threshold from earlier readings since the last watering
  const ms = logsOf(p.id, "moist").filter(x => (!lw || x.date >= lw.date) && x.date < date);
  let days = null;
  if (ms.length) {
    const prev = ms[ms.length - 1], dd = diff(prev.date, date), drop = prev.value - v;
    if (dd > 0 && drop > 0) days = Math.max(1, Math.round((v - p.moistureMin) / (drop / dd)));
  }
  const wd = due(p, "water");
  if (days === null) days = Math.max(2, Math.round((iv || 10) / 4));
  const until = addDays(date, days);
  const out = { text: `수분 ${v}% — 아직 촉촉합니다(기준 ${p.moistureMin}%). ` +
      (ms.length && days ? `지금 마르는 속도면 약 <b>${days}일 뒤</b> 기준에 닿습니다.` : `<b>${days}일 뒤</b> 다시 재 보세요.`), actions: [] };
  if (!wd.unknown && !wd.none && wd.date < until) {
    out.actions.push({ t: `물 ${md(until)}로 미루기`, f: () => { db.log.push({ id: uid(), plant: p.id, type: "snooze", kind: "water", date, until }); save(); drawPlant(p); toast(`물을 ${md(until)}로 미뤘습니다`); } });
  }
  return out;
}
function afterWater(p, date) {      // watering on a day the soil was measured dry: offer the real interval
  const lw = last(p.id, "water"), m = lastMoist(p), s = season(date), iv = p.water[s];
  if (!lw || !m || m.date !== date || m.value > p.moistureMin || !iv) return null;
  const since = diff(lw.date, date);
  if (since <= 0 || Math.abs(since - iv) < Math.max(2, iv * 0.2)) return null;
  return { text: `이번에는 ${since}일 만에 물을 줬습니다(흙 ${m.value}%). ${SEASON_KO[s]} 간격 ${iv}일을 ${since}일로 바꿀까요?`,
           actions: [{ t: `${since}일로 바꾸기`, f: () => setInterval_(p, s, since) }] };
}
function setInterval_(p, s, n) {
  const old = p.water[s]; p.water[s] = n;
  db.log.push({ id: uid(), plant: p.id, type: "edit", date: today(), note: `${s === "warm" ? "물(따뜻)" : "물(추운)"} ${old}일 → ${n}일` });
  save(); drawPlant(p); toast(`간격을 ${n}일로 바꿨습니다`);
}
function showSuggest(p, sg) {
  const box = sheet.querySelector("#sg");
  box.innerHTML = `<div class="card suggest"><p>${sg.text}</p><div class="row2">${sg.actions.map((a, i) => `<button class="btn ${i ? "btn-ghost" : "btn-moist"}" data-a="${i}">${a.t}</button>`).join("")}<button class="btn btn-ghost" data-a="x">닫기</button></div></div>`;
  for (const b of box.querySelectorAll("[data-a]")) b.onclick = () => { if (b.dataset.a === "x") box.innerHTML = ""; else sg.actions[+b.dataset.a].f(); };
  box.scrollIntoView({ behavior: "smooth", block: "center" });
}

// ---- shell ----
let toastT;
function toast(t, action) {
  const e = document.getElementById("toast"); e.textContent = t; e.style.display = "block";
  if (action) { const b = document.createElement("button"); b.textContent = action.label; b.className = "toastbtn"; b.onclick = () => { e.style.display = "none"; action.run(); }; e.appendChild(b); }
  clearTimeout(toastT); toastT = setTimeout(() => e.style.display = "none", action ? 6000 : 2200);
}
const TRASH_DAYS = 30, TYPE_KO = ({ water: "물", fert: "비료", moist: "수분", snooze: "미룸", edit: "변경", diag: "상태 묻기" });
function trashIt(what, data, extra = {}) { (db.trash ??= []).push({ id: uid(), what, data, at: Date.now(), ...extra }); }
function removeLog(l, p) {                    // p: the plant whose page is open (redrawn), or null
  db.log = db.log.filter(x => x !== l); trashIt("log", l); const t = db.trash.at(-1); save();
  if (p) drawPlant(p); else render();
  toast(`${md(l.date)} ${TYPE_KO[l.type] || ""} 기록을 지웠습니다`, { label: "되돌리기", run: () => restore(t.id) });
}
function restore(id) {
  const t = (db.trash || []).find(x => x.id === id); if (!t) return;
  if (t.what === "log" && !db.log.some(l => l.id === t.data.id)) db.log.push(t.data);
  if (t.what === "plant") {
    if (!db.plants.some(p => p.id === t.data.id)) db.plants.push(t.data);
    for (const l of t.logs || []) if (!db.log.some(x => x.id === l.id)) db.log.push(l);
  }
  db.trash = db.trash.filter(x => x !== t); save();
  if (sheet && t.what === "log") { const p = db.plants.find(x => x.id === t.data.plant); if (p) drawPlant(p); } else render();
  toast("되살렸습니다");
}
function pruneTrash() { const cut = Date.now() - TRASH_DAYS * 86400000; if (db.trash) db.trash = db.trash.filter(t => t.at > cut); }
function header() { document.getElementById("today").textContent = `${today()} · ${SEASON_KO[season(today())]} · 식물 ${db.plants.length}그루`; if (typeof sensorBadge === "function") sensorBadge(); }
function render() {
  header();
  for (const b of document.querySelectorAll("nav button")) b.classList.toggle("on", b.dataset.tab === tab);
  ({ todo: renderTodo, plants: renderPlants, ask: renderChat, settings: renderSettings })[tab]();
}
document.querySelector("nav").onclick = e => { const t = e.target.dataset.tab; if (t) { tab = t; settingsSub = null; sheet?.remove(); sheet = null; document.body.classList.remove("locked"); render(); window.scrollTo(0, 0); } };
view.onclick = e => {
  if (e.target.closest(".todayamt input, .amtbox")) return;      // typing litres must not open the plant
  const x = e.target.closest("[data-addx]"); if (x) return addExtra(x);
  const a = e.target.closest("[data-amt]"); if (a) return editAmount(a);
  const c = e.target.closest("[data-open]"); if (c) openPlant(c.dataset.open);
};
// how much was given: water in litres (a number), fertilizer as written (e.g. "2mL", "반 스푼")
// 오늘 한 일: the litres box between the name and the ✓ — saved as soon as it is changed
view.addEventListener("change", e => {
  const inp = e.target.closest("[data-wl]"); if (!inp) return;
  const l = db.log.find(x => x.id === inp.dataset.wl); if (!l) return;
  // the box holds the total of the watering (처음 + 추가): changing it changes the first amount
  const plus = Number(inp.dataset.plus) || 0, n = parseFloat(inp.value);
  if (n > 0 && plus && n <= plus) { toast(`추가한 ${r2(plus)}L보다 커야 합니다`); render(); return; }
  if (n > 0) l.amount = r2(n - plus); else delete l.amount;
  save(); render(); toast(n > 0 ? `물 합계 ${r2(n)}L 기록했습니다` : "물 양을 지웠습니다");
});
// one plant's watering (처음 관수 + 추가 관수, up to 3 days): the box shows the total and is always visible,
// under the place "10/24 4L · 10/25 +1L" (each 추가 can be tapped to change/remove), a [+ 추가] button, ✓ marks
const r2 = n => Math.round(n * 100) / 100;
function waterRound(p) {
  const ws = logsOf(p.id, "water").filter(l => l.date <= today());        // newest first
  const main = ws.find(l => !l.extra) || null;
  const extras = ws.filter(l => l.extra && (!main || l.date >= main.date) && diff(l.date, today()) <= 2).reverse();
  if (!extras.length && (!main || diff(main.date, today()) > 2)) return null;
  const base = main ? Number(main.amount ?? p.waterL) || 0 : 0, plus = extras.reduce((a, l) => a + (Number(l.amount) || 0), 0);
  return { main, extras, plus: r2(plus), total: r2(base + plus) };
}
function doneRow(p, did, ago = 0) {
  const w = waterRound(p), fert = did.filter(l => l.type === "fert");
  let parts = "";
  if (w && w.extras.length) {
    const days = new Map();
    if (w.main) days.set(w.main.date, [`${amountText(w.main) || (p.waterL ? p.waterL + "L" : "?")}`]);
    for (const l of w.extras) { if (!days.has(l.date)) days.set(l.date, []); days.get(l.date).push(`<button class="badge b-water amt" data-amt="${l.id}">+${amountText(l) || "?"}</button>`); }
    parts = [...days].map(([d, xs]) => `<span>${md(d)} ${xs.join(" ")}</span>`).join(" ");
  }
  return `<div class="card plant done" data-when="${["t", "y", "2"][ago]}" data-open="${p.id}">
      <div class="main"><div class="name">${esc(p.name)}</div><div class="loc">${esc(p.location)}</div>${parts ? `<div class="loc wparts">${parts}</div>` : ""}</div>
      <div class="todayamt">${w ? (w.main ? `💧<input type="number" inputmode="decimal" step="0.1" min="0" data-wl="${w.main.id}" data-plus="${w.plus}" value="${w.main.amount != null || w.plus ? w.total : ""}" placeholder="${p.waterL ?? "—"}">L` : `💧${w.total}L`) : ""}
        <button class="badge b-water amt" data-addx="${p.id}">+ 추가</button></div>
      <div class="badges">${w ? `<span class="badge b-moist">물 ✓</span>` : ""}${fert.map(l => `<button class="badge b-moist amt" data-amt="${l.id}">비료 ${amountText(l) || ""} ✓</button>`).join("")}</div></div>`;
}
// [+ 추가]: one tap on 0.5L or 1L adds that much (today — also when the watering started earlier); tap again to add more; 취소 leaves
const QUICK = [0.5, 1];
const quickBox = (label, extra = "") => `<div class="amtbox quick">${label} ${QUICK.map(n => `<button class="btn" data-q="${n}">${n}L</button>`).join("")}${extra}<button class="btn ghost" data-cancel>취소</button></div>`;
function addExtra(btn) {
  const p = db.plants.find(x => x.id === btn.dataset.addx); if (!p) return;
  const box = btn.closest(".todayamt");
  box.innerHTML = quickBox("추가");
  box.onclick = e => {
    e.stopPropagation();
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.cancel != null) return render();
    const n = Number(b.dataset.q);
    db.log.push({ id: uid(), plant: p.id, type: "water", date: today(), extra: true, amount: n }); save(); render();
    const w = waterRound(p); toast(`${p.name} 추가 ${n}L · 합계 ${w ? w.total : n}L`);
  };
}
function amountText(l) { return l.amount == null || l.amount === "" ? "" : l.type === "water" ? `${l.amount}L` : String(l.amount); }
// tapping an amount: a 추가 is changed with the same 0.5L / 1L buttons (or 삭제); the first watering and fertilizer are typed; 취소 leaves without saving
function editAmount(btn) {
  const l = db.log.find(x => x.id === btn.dataset.amt); if (!l) return;
  const card = btn.closest(".card"), water = l.type === "water", box = water ? card.querySelector(".todayamt") : card.querySelector(".badges");
  box.onclick = e => e.stopPropagation();
  if (water && l.extra) {
    box.innerHTML = quickBox(`+${amountText(l)} →`, `<button class="btn ghost" data-del>삭제</button>`);
    box.onclick = e => {
      e.stopPropagation();
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.cancel != null) return render();
      if (b.dataset.del != null) { db.log = db.log.filter(x => x !== l); save(); render(); return toast("추가 관수를 지웠습니다"); }
      l.amount = Number(b.dataset.q); save(); render(); toast(`추가 ${l.amount}L로 바꿨습니다`);
    };
    return;
  }
  box.innerHTML = `<div class="amtbox">${water ? "물" : "비료"} <input ${water ? 'type="number" inputmode="decimal" step="0.1" min="0"' : 'type="text" placeholder="예: 2mL"'} value="${esc(l.amount ?? "")}">${water ? " L" : ""} <button class="btn" data-save style="padding:6px 12px">저장</button><button class="btn ghost" data-cancel style="padding:6px 12px">취소</button></div>`;
  const inp = box.querySelector("input"); inp.focus(); inp.select?.();
  const done = () => {
    const v = inp.value.trim();
    if (water) { const n = parseFloat(v); if (n > 0) l.amount = Math.round(n * 100) / 100; else delete l.amount; }
    else if (v) l.amount = v; else delete l.amount;
    save(); render(); toast(`${water ? "물" : "비료"} ${amountText(l) || "양 지움"} 기록했습니다`);
  };
  box.querySelector("[data-save]").onclick = done; box.querySelector("[data-cancel]").onclick = () => render();
  inp.onkeydown = e => { if (e.key === "Enter") done(); if (e.key === "Escape") render(); };
}
// coming back to the app refreshes the lists (dates move on); never redraw a screen with a photo/file picker in use
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  if (!sheet && (tab === "todo" || tab === "plants")) render();
  syncSensors().then(c => { if (c && !sheet && (tab === "todo" || tab === "plants")) render(); }).catch(() => {});
  syncNow().catch(() => {});
});

db = load() || fromSeed();
function dedupe() {
  const seen = new Set(), before = db.log.length;
  db.log = db.log.filter(l => {
    if (l.type !== "water" && l.type !== "fert") return true;
    const k = `${l.plant}|${l.type}|${l.date}`;
    if (seen.has(k)) return false; seen.add(k); return true;
  });
  return before - db.log.length;
}
// one-time setup link: #import=<base64url JSON>. The part after # never leaves the phone (it is not sent to the web server).
if (location.hash.startsWith("#import=")) {
  try {
    const t = location.hash.slice(8).replace(/-/g, "+").replace(/_/g, "/");
    const d = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(t), c => c.charCodeAt(0))));
    if (!Array.isArray(d.plants) || !Array.isArray(d.log)) throw 0;
    if (!db.plants.length || confirm(`지금 데이터를 식물 ${d.plants.length}그루 데이터로 바꿀까요?`)) { db = d; toast(`식물 ${d.plants.length}그루를 넣었습니다`); }
  } catch (e) { toast("데이터 링크를 읽지 못했습니다"); }
  history.replaceState(null, "", location.pathname);
}
setTimeout(() => syncSensors().then(c => { if (c && !sheet && (tab === "todo" || tab === "plants")) render(); }).catch(() => {}), 300);
if (location.hash.startsWith("#connect=")) {
  const code = location.hash.slice(9); history.replaceState(null, "", location.pathname);
  setTimeout(() => connectWith(code, "merge").then(() => { toast("서버에 연결했습니다"); render(); }).catch(e => toast(e.message)), 200);
} else setTimeout(() => syncNow().catch(() => {}), 200);
pruneTrash();
const removed = dedupe(); if (removed) setTimeout(() => toast(`같은 날 중복 기록 ${removed}건을 정리했습니다`), 300);
save(); render();
// ---- updates: check on every open/return; when a new version takes over, reload once (not while a plant is open) ----
const APP_VERSION = "39";
let pendingReload = false;
if ("serviceWorker" in navigator && (location.protocol === "https:" || ["localhost", "127.0.0.1"].includes(location.hostname))) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController || pendingReload) return;
    pendingReload = true;
    if (!sheet) location.reload(); else toast("새 버전이 준비됐습니다. 목록으로 돌아가면 적용됩니다");
  });
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(r => {
    r.update().catch(() => {});
    document.addEventListener("visibilitychange", () => { if (!document.hidden) r.update().catch(() => {}); });
  }).catch(() => {});
}
async function forceUpdate() {
  try {
    for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
    for (const k of await caches.keys()) await caches.delete(k);
  } catch (e) {}
  location.reload();
}
